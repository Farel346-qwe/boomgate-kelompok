<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Reader - BoomGate</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Library Eclipse Paho MQTT JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      color: #166534;
      text-align: center;
    }

    .box {
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .info {
      background: #eff6ff;
    }

    .result {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #scanStatus {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .green {
      color: #166534;
    }

    .red {
      color: #b91c1c;
    }

    .gray {
      color: #475569;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>QR Reader BoomGate</h1>

    <p style="text-align:center">
      Praktikum Internet of Things
    </p>

    <div class="box info">
      <strong>Status database:</strong>
      <p id="databaseStatus">Memuat database...</p>

      <strong>Status MQTT:</strong>
      <p id="mqttStatus">Menyiapkan koneksi...</p>
    </div>

    <div id="reader"></div>

    <div class="box result">
      <strong>Hasil scan:</strong>
      <p id="result">Belum ada QR yang dipindai.</p>

      <strong>Data mahasiswa:</strong>
      <p id="studentInfo">Belum ada data.</p>

      <p id="scanStatus" class="gray">
        Arahkan kamera ke QR yang berisi NIM.
      </p>
    </div>
  </main>

  <script>
    // =========================
    // KONFIGURASI MQTT
    // =========================

    const MQTT_HOST = "broker.hivemq.com";
    const MQTT_PORT = 8884;
    const MQTT_PATH = "/mqtt";

    const MQTT_TOPIC =
      "unesa/ti/boomgate/praktikum6_7f31/command";

    // Client ID unik, maksimum 23 karakter
    const CLIENT_ID =
      "bgweb-" + Math.random().toString(16).slice(2, 10);

    let mqttClient = null;
    let mqttConnected = false;

    // =========================
    // ELEMEN HALAMAN
    // =========================

    const resultElement =
      document.getElementById("result");

    const studentInfoElement =
      document.getElementById("studentInfo");

    const scanStatusElement =
      document.getElementById("scanStatus");

    const databaseStatusElement =
      document.getElementById("databaseStatus");

    const mqttStatusElement =
      document.getElementById("mqttStatus");

    // =========================
    // DATABASE MAHASISWA
    // =========================

    let mahasiswaData = [];
    let databaseSiap = false;
    let lastPublishedNim = "";

    async function loadDatabase() {
      try {
        const response =
          await fetch("./mahasiswa.json");

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "Format database bukan array."
          );
        }

        const validFormat = data.every(
          (item) =>
            item &&
            item.NIM !== undefined &&
            item.NAMA !== undefined
        );

        if (!validFormat) {
          throw new Error(
            "Field NIM/NAMA tidak lengkap."
          );
        }

        mahasiswaData = data;
        databaseSiap = true;

        databaseStatusElement.textContent =
          "Siap (" + data.length + " mahasiswa).";

        databaseStatusElement.className = "green";

        console.log(
          "Database siap:",
          mahasiswaData
        );

      } catch (error) {
        databaseSiap = false;

        databaseStatusElement.textContent =
          "Gagal memuat database.";

        databaseStatusElement.className = "red";

        console.error(
          "Database error:",
          error
        );
      }
    }

    // =========================
    // KONEKSI MQTT WEBSOCKET
    // =========================

    function connectMQTT() {
      mqttStatusElement.textContent =
        "Menghubungkan ke broker...";

      mqttStatusElement.className = "gray";

      try {
        mqttClient = new Paho.MQTT.Client(
          MQTT_HOST,
          MQTT_PORT,
          MQTT_PATH,
          CLIENT_ID
        );

        mqttClient.onConnectionLost = function (response) {
          mqttConnected = false;

          mqttStatusElement.textContent =
            "Koneksi MQTT terputus. Muat ulang halaman jika perlu.";

          mqttStatusElement.className = "red";

          console.error(
            "MQTT connection lost:",
            response.errorMessage
          );
        };

        mqttClient.connect({
          useSSL: true,
          timeout: 10,
          keepAliveInterval: 30,
          cleanSession: true,

          onSuccess: function () {
            mqttConnected = true;

            mqttStatusElement.textContent =
              "Terhubung ke HiveMQ via WebSocket.";

            mqttStatusElement.className = "green";

            console.log(
              "MQTT WebSocket berhasil terhubung."
            );
          },

          onFailure: function (error) {
            mqttConnected = false;

            mqttStatusElement.textContent =
              "MQTT gagal terhubung. Periksa koneksi.";

            mqttStatusElement.className = "red";

            console.error(
              "MQTT connection failed:",
              error.errorMessage
            );
          }
        });

      } catch (error) {
        mqttConnected = false;

        mqttStatusElement.textContent =
          "Library MQTT gagal dijalankan.";

        mqttStatusElement.className = "red";

        console.error(error);
      }
    }

    // =========================
    // KIRIM JSON MELALUI MQTT
    // =========================

    function publishMahasiswa(mahasiswa) {
      if (!mqttConnected || !mqttClient) {
        scanStatusElement.textContent =
          "NIM valid, tetapi MQTT belum terhubung. Pesan belum dikirim.";

        scanStatusElement.className = "red";
        return false;
      }

      const payload = {
        NIM: String(mahasiswa.NIM),
        NAMA: String(mahasiswa.NAMA)
      };

      try {
        const message = new Paho.MQTT.Message(
          JSON.stringify(payload)
        );

        message.destinationName = MQTT_TOPIC;
        message.qos = 0;

        mqttClient.send(message);

        console.log(
          "Topic:",
          MQTT_TOPIC
        );

        console.log(
          "Payload:",
          JSON.stringify(payload)
        );

        scanStatusElement.textContent =
          "Data valid. Pesan JSON dikirim ke MQTT.";

        scanStatusElement.className = "green";

        return true;

      } catch (error) {
        console.error(
          "Gagal mengirim MQTT:",
          error
        );

        scanStatusElement.textContent =
          "Pengiriman MQTT gagal.";

        scanStatusElement.className = "red";

        return false;
      }
    }

    // =========================
    // HASIL PEMINDAIAN QR
    // =========================

    function onScanSuccess(decodedText) {
      const nim = decodedText.trim();

      resultElement.textContent = nim;

      if (!databaseSiap) {
        studentInfoElement.textContent =
          "Database belum siap.";

        scanStatusElement.textContent =
          "Periksa status database.";

        scanStatusElement.className = "red";
        return;
      }

      // Cari mahasiswa berdasarkan NIM
      const mahasiswa = mahasiswaData.find(
        (item) =>
          String(item.NIM).trim() === nim
      );

      if (!mahasiswa) {
        // Izinkan scan ulang setelah QR tidak valid
        lastPublishedNim = "";

        studentInfoElement.textContent =
          "NIM tidak terdaftar.";

        scanStatusElement.textContent =
          "QR ditolak karena NIM tidak ditemukan.";

        scanStatusElement.className = "red";

        console.log(
          "NIM tidak ditemukan:",
          nim
        );

        return;
      }

      studentInfoElement.textContent =
        "NIM: " + mahasiswa.NIM +
        " | Nama: " + mahasiswa.NAMA;

      // Hindari mengirim pesan berulang kali
      // ketika QR yang sama tetap berada di kamera
      if (lastPublishedNim === nim) {
        return;
      }

      const berhasil =
        publishMahasiswa(mahasiswa);

      if (berhasil) {
        lastPublishedNim = nim;
      }
    }

    function onScanFailure(error) {
      // Tidak menampilkan error setiap frame kamera.
    }

    // =========================
    // MULAI APLIKASI
    // =========================

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

    // Muat database dan hubungkan MQTT
    loadDatabase();
    connectMQTT();
  </script>
</body>
</html>
