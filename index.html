<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Reader - BoomGate</title>

  <!-- Library untuk membaca QR Code -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      margin-top: 0;
      color: #166534;
      text-align: center;
    }

    .description {
      text-align: center;
      line-height: 1.6;
      color: #475569;
    }

    #reader {
      width: 100%;
      margin: 24px auto;
    }

    .box {
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .database-box {
      background: #eff6ff;
    }

    .result-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    #result, #studentInfo {
      overflow-wrap: anywhere;
    }

    #result {
      font-size: 18px;
      font-weight: bold;
    }

    #scanStatus {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      background: #166534;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>QR Reader BoomGate</h1>

    <p class="description">
      Praktikum Internet of Things
      <br>
      Langkah 4: Database Mahasiswa
    </p>

    <div class="box database-box">
      <strong>Status database:</strong>
      <p id="databaseStatus">Memuat database...</p>
    </div>

    <!-- Area kamera dan scanner -->
    <div id="reader"></div>

    <!-- Hasil QR dan pencarian mahasiswa -->
    <div class="box result-box">
      <strong>Hasil scan:</strong>
      <p id="result">Belum ada QR yang dipindai.</p>

      <strong>Data mahasiswa:</strong>
      <p id="studentInfo">Belum ada data.</p>

      <p id="scanStatus">
        Arahkan kamera ke QR Code yang berisi NIM.
      </p>
    </div>

    <button id="clearButton" type="button">
      Hapus hasil scan
    </button>
  </main>

  <script>
    const resultElement =
      document.getElementById("result");

    const studentInfoElement =
      document.getElementById("studentInfo");

    const scanStatusElement =
      document.getElementById("scanStatus");

    const databaseStatusElement =
      document.getElementById("databaseStatus");

    const clearButton =
      document.getElementById("clearButton");

    // Menyimpan data mahasiswa dari JSON
    let mahasiswaData = [];
    let databaseSiap = false;

    // Mengambil file mahasiswa.json
    async function loadDatabase() {
      try {
        const response = await fetch("./mahasiswa.json");

        if (!response.ok) {
          throw new Error(
            "HTTP error: " + response.status
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "Format JSON harus berupa kumpulan data."
          );
        }

        // Validasi dasar format database
        const validData = data.every((item) =>
          item &&
          item.NIM !== undefined &&
          item.NAMA !== undefined
        );

        if (!validData) {
          throw new Error(
            "Field NIM atau NAMA tidak lengkap."
          );
        }

        mahasiswaData = data;
        databaseSiap = true;

        databaseStatusElement.textContent =
          "Siap (" + mahasiswaData.length +
          " mahasiswa).";

        databaseStatusElement.style.color =
          "#166534";

        console.log(
          "Database berhasil dimuat:",
          mahasiswaData
        );

      } catch (error) {
        databaseSiap = false;

        databaseStatusElement.textContent =
          "Gagal dimuat. Periksa file JSON.";

        databaseStatusElement.style.color =
          "#b91c1c";

        scanStatusElement.textContent =
          "Database belum siap. Coba muat ulang halaman.";

        console.error(
          "Gagal memuat database:",
          error
        );
      }
    }

    // Dipanggil saat QR berhasil dibaca
    function onScanSuccess(decodedText) {
      const nim = decodedText.trim();

      resultElement.textContent = nim;
      studentInfoElement.textContent =
        "Sedang mencari data...";

      if (!databaseSiap) {
        studentInfoElement.textContent =
          "Data belum dapat diperiksa.";

        scanStatusElement.textContent =
          "Database belum berhasil dimuat.";

        return;
      }

      // Mencari mahasiswa berdasarkan NIM
      const mahasiswa = mahasiswaData.find(
        (item) =>
          String(item.NIM).trim() === nim
      );

      if (mahasiswa) {
        studentInfoElement.textContent =
          "NIM: " + mahasiswa.NIM +
          " | Nama: " + mahasiswa.NAMA;

        scanStatusElement.textContent =
          "Mahasiswa ditemukan. QR berhasil divalidasi.";

        scanStatusElement.style.color =
          "#166534";

        console.log(
          "Mahasiswa ditemukan:",
          mahasiswa
        );

      } else {
        studentInfoElement.textContent =
          "Tidak ada data mahasiswa.";

        scanStatusElement.textContent =
          "NIM " + nim +
          " tidak terdaftar di database.";

        scanStatusElement.style.color =
          "#b91c1c";

        console.log(
          "NIM tidak ditemukan:",
          nim
        );
      }
    }

    function onScanFailure(error) {
      // Kegagalan membaca satu frame kamera
      // tidak perlu ditampilkan berulang kali.
    }

    // Siapkan scanner
    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

    // Ambil data dari server ketika halaman dibuka
    loadDatabase();

    // Menghapus tampilan hasil pengujian
    clearButton.addEventListener("click", function () {
      resultElement.textContent =
        "Belum ada QR yang dipindai.";

      studentInfoElement.textContent =
        "Belum ada data.";

      scanStatusElement.textContent =
        "Arahkan kamera ke QR Code yang berisi NIM.";

      scanStatusElement.style.color =
        "#475569";
    });
  </script>
</body>
</html>
